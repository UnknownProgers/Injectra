name: CI
on: [ push, pull_request ]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 11.0.x
      - run: dotnet restore Injectra.slnx
      - run: dotnet test Injectra.slnx --no-restore --configuration Release --logger "trx;LogFileName=tests.trx"
      - run: dotnet pack Lifecycle/Lifecycle.csproj --no-build --configuration Release --output artifacts
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: '**/TestResults/*.trx'
